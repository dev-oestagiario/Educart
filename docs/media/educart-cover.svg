 <text x="76" y="155" font-size="15" font-weight="700" letter-spacing="3" fill="#c5afff">GESTÃO EDUCACIONAL · WEB APP</text>
 <text x="72" y="223" font-size="58" font-weight="750" fill="#fbf8ff">Tecnologia disponível</text>
 <text x="72" y="289" font-size="58" font-weight="750" fill="#c4adff">para cada aula.</text>
 <text x="76" y="340" font-size="23" fill="#d5cde2">Reserve, organize e acompanhe laboratórios móveis</text>
 <text x="76" y="371" font-size="23" fill="#d5cde2">em um único ambiente digital.</text>
 <rect x="76" y="410" width="170" height="44" rx="22" fill="#352847" stroke="#6c528f"/>
 <text x="161" y="438" text-anchor="middle" font-size="16" font-weight="650" fill="#eee2ff">Sem instalação</text>
