 <text x="353" y="438" text-anchor="middle" font-size="16" font-weight="650" fill="#eee2ff">Desktop e mobile</text>
 <rect x="460" y="410" width="178" height="44" rx="22" fill="#352847" stroke="#6c528f"/>
 <text x="549" y="438" text-anchor="middle" font-size="16" font-weight="650" fill="#eee2ff">Agenda pública</text>
</g>
