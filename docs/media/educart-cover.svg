<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">Educart — Tecnologia disponível para cada aula</title>
<desc id="desc">Banner institucional violeta com ilustração de um laboratório móvel, notebooks e uma agenda.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15121e"/><stop offset="1" stop-color="#30213f"/></linearGradient>
 <linearGradient id="a" x2="1" y2="1"><stop stop-color="#c0a7ff"/><stop offset="1" stop-color="#8060d4"/></linearGradient>
 <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#b5a1de" opacity=".14"/></pattern>
</defs>
<rect width="1440" height="520" rx="28" fill="url(#bg)"/>
<rect x="790" y="0" width="650" height="520" fill="url(#dots)"/>
