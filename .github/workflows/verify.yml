name: Verificação do Educart
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: educart-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Inventário de vulnerabilidades npm
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); if(!r.metadata) throw Error('npm audit indisponível'); console.log(JSON.stringify({metadata:r.metadata.vulnerabilities,findings:Object.entries(r.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fix:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})}))}));"
      - name: Validar tipos e compilar
        run: npm run build
      - name: Executar testes
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Executar testes E2E com backend simulado
        run: npm run test:e2e
      - name: Guardar evidências dos testes (incluindo screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidencias
          path: test-results
          if-no-files-found: ignore
