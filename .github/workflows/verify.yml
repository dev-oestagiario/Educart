name: Verificação do Educart
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read

concurrency:
  group: educart-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Bloquear vulnerabilidades altas e críticas
        run: npm run audit
      - name: Validar tipos e compilar
        run: npm run build
      - name: Executar testes
        run: npm run test
      - name: Validar regras de promoção
        run: node --test scripts/git-flow.test.mjs scripts/verificar-ci-release.test.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Preparar acessibilidade automatizada
        run: npm install --prefix .local-sql-test --ignore-scripts --save-exact axe-core@4.11.1 --no-audit --no-fund
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Executar testes E2E com backend simulado
        run: npm run test:e2e
      - name: Guardar evidências dos testes (incluindo screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidencias
          path: test-results
          if-no-files-found: ignore
