name: Verificação do Educart
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar lockfile para consolidacao F0
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const s=require('fs').readFileSync('package-lock.json').toString('base64'); for(let i=0;i<s.length;i+=2000) console.log('EDUCART_LOCK:'+s.slice(i,i+2000));"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar tipos e compilar
        run: npm run build
      - name: Executar testes
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Executar testes E2E com backend simulado
        run: npm run test:e2e
      - name: Guardar evidências dos testes (incluindo screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidencias
          path: test-results
          if-no-files-found: ignore
