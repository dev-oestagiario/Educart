name: Homologação Educart — Supabase isolado
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: educart-homologacao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homologacao:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EDUCART_DISPOSABLE_HOMOLOGACAO: educart-homologacao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Validar preflight
        run: npm run test:homologacao:preflight
      - name: Preparar CLI
        run: |
          npx --yes supabase@2.79.0 --version
          npx --yes supabase@2.79.0 start --help
          npx --yes supabase@2.79.0 status --help
      - name: Iniciar ambiente descartável
        run: |
          umask 077
          npx --yes supabase@2.79.0 start > /tmp/educart-local-start.log 2>&1 || { echo "Falha ao iniciar Supabase local."; exit 1; }
          npx --yes supabase@2.79.0 status -o json > .env.homologacao.status.local
      - name: Conferir histórico de migrations
        run: npx --yes supabase@2.79.0 migration list --local
      - name: Preparar Chromium
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - name: Preparar WebKit
        timeout-minutes: 8
        run: npx playwright install --with-deps webkit
      - name: Preparar verificador PDF
        timeout-minutes: 4
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends poppler-utils
          fi
          command -v pdftotext
          command -v pdfinfo
      - name: Executar as 11 suítes de homologação real
        run: npm run test:homologacao
      - name: Encerrar ambiente isolado
        if: always()
        run: |
          rm -f .env.homologacao.status.local /tmp/educart-local-start.log
          npx --yes supabase@2.79.0 stop --no-backup
