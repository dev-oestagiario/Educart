name: Publicar previa web do Educart — Fase 6

on:
  push:
    branches:
      - feat/fase-6-portal-professores
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'vitest.config.ts'
      - 'e2e/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-educart
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: educart-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Executar testes
        run: npm run test

      - name: Preparar Chromium para testes de navegador
        run: npx playwright install --with-deps chromium

      - name: Validar fluxos e navegacao mobile antes do deploy
        run: npm run test:e2e

      - name: Compilar versao web
        env:
          VITE_SUPABASE_URL: https://tsruibcrvnxiwgrfrecu.supabase.co
          # Chave PUBLICAVEL: e enviada ao navegador, nao e uma chave secreta.
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_k5cR7QLJf5MTpHQvOYQgmg_LoX7EgBZ
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
