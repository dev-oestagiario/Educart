name: Publicar Educart — produção

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'SHA completo da main aprovado após #66–#70'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-educart
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Exigir autorização da promoção deste SHA
        env:
          REQUESTED_SHA: ${{ inputs.approved_sha }}
          APPROVED_SHA: ${{ vars.EDUCART_APPROVED_RELEASE_SHA }}
        run: |
          if [[ ! "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ || "$REQUESTED_SHA" != "$GITHUB_SHA" || "$APPROVED_SHA" != "$GITHUB_SHA" ]]; then
            echo 'Publicação bloqueada: aprovação institucional do SHA ausente ou divergente.'
            exit 1
          fi

      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Bloquear vulnerabilidades altas e críticas
        run: npm run audit
      - name: Executar testes
        run: npm run test

      - name: Validar scripts operacionais
        run: node --test scripts/verificar-f5-2-layout.mjs scripts/email-worker.test.mjs scripts/verificar-saude-deploy.test.mjs scripts/verificar-artefato-release.test.mjs scripts/homologacao-preflight.test.mjs scripts/verificar-backup-operacional.test.mjs scripts/monitorar-operacao.test.mjs

      - name: Preparar acessibilidade automatizada
        run: npm install --prefix .local-sql-test --ignore-scripts --save-exact axe-core@4.11.1 --no-audit --no-fund

      - name: Preparar Chromium para testes de navegador
        run: npx playwright install --with-deps chromium

      - name: Validar fluxos e navegacao mobile antes do deploy
        run: npm run test:e2e

      - name: Compilar versao web
        env:
          VITE_SUPABASE_URL: https://tsruibcrvnxiwgrfrecu.supabase.co
          # Chave PUBLICAVEL: e enviada ao navegador, nao e uma chave secreta.
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_k5cR7QLJf5MTpHQvOYQgmg_LoX7EgBZ
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Registrar versão publicada
        run: |
          node -e "require('fs').writeFileSync('dist/version.json',JSON.stringify({commit:process.env.GITHUB_SHA,ref:process.env.GITHUB_REF_NAME,build:new Date().toISOString()},null,2))"
      - name: Validar metadados e arquivos do candidato
        run: node scripts/verificar-artefato-release.mjs dist "$GITHUB_SHA" "$GITHUB_REF_NAME"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
